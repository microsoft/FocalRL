# Checkpoint evaluation: Serper search and Jina page fetching.
search:
  type: native
  provider: ${oc.env:AGENT_SEARCH_PROVIDER,serper}
  ms_api_keys: ${oc.env:MS_API_KEYS,}
  ms_endpoint: ${oc.env:SEARCH_ENDPOINT,http://localhost:8002/search}
  content_format: passage
  max_length: 120
  max_results_per_query: 10
  max_queries_per_call: 3
  max_concurrency: 16
  max_qps: 0
  timeout: 60
  num_retries: 3
  cache_path: .cache/eval-search.sqlite
  serpent_api_key: ${oc.env:SERPENT_API_KEY,}
  serpent_endpoint: ${oc.env:SERPENT_ENDPOINT,http://localhost:8002/serpent_endpoint}
  serpent_engine: google
  serpent_country: us
  serpent_format: full
  serpent_cache_path: .cache/search-serpent_cache_path.sqlite
  serper_api_key: ${oc.env:SERPER_API_KEY,}
  serper_endpoint: ${oc.env:SERPER_ENDPOINT,https://google.serper.dev/search}
  serper_country: us
  serper_language: en
  serper_cache_path: .cache/search-serper_cache_path.sqlite
  prismcrawl_api_key: ${oc.env:PRISMCRAWL_API_KEY,}
  prismcrawl_endpoint: ${oc.env:PRISMCRAWL_ENDPOINT,http://localhost:8002/prismcrawl_endpoint}
  prismcrawl_country: us
  prismcrawl_language: en
  prismcrawl_cache_path: .cache/search-prismcrawl_cache_path.sqlite
fetch_url:
  type: native
  ms_api_keys: ${oc.env:MS_API_KEYS,}
  ms_fallback_enabled: false
  ms_endpoint: ${oc.env:BROWSE_ENDPOINT,http://localhost:8002/fetch_url}
  content_format: markdown
  ms_max_length: 500000
  live_crawl: fallback
  render_dynamic_pages: true
  max_urls_per_call: 3
  max_concurrency: 16
  jina_primary: true
  jina_base_url: ${oc.env:JINA_BASE_URL,https://r.jina.ai}
  jina_timeout: 120
  jina_num_retries: 2
  jina_max_concurrency: 64
  jina_terminal_target_statuses:
  - 404
  - 410
  ms_num_retries: 1
  browser_llm_url: ${oc.env:BROWSER_LLM_URL}
  browser_llm_key: ${oc.env:LLM_API_KEY}
  browser_llm_model: ${oc.env:BROWSER_LLM_MODEL,gpt-5.6-luna}
  browser_llm_max_input_tokens: 95000
  browser_llm_max_output_tokens: 10000
  browser_llm_max_concurrency: 16
  timeout: 300
  num_retries: 3
  fallback_raw_chars: 10000
  cache_path: .cache/eval-fetch-url.sqlite
  raw_cache_path: .cache/eval-fetch-url-raw.sqlite
